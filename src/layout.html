<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101c26" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{TITLE}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preload" href="/i18n.js" as="script">
  <!-- i18n 首屏脚本：在任何内容渲染前写入 <html data-language>，避免英文模式下「先中文再变英文」的闪烁。
       必须保持内联同步执行；CSP 需允许内联脚本（当前 script-src 已含 'unsafe-inline'，若收紧请改用 nonce 或本段 hash）。 -->
  <script>{{I18N_BOOT}}</script>
</head>

<body class="{{BODY_CLASS}}" data-i18n-domains="{{I18N_DOMAINS}}">
  <div class="page">
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="desktop-header">
      <a href="/" class="logo"><span class="logo-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#0A0A0F"/><g transform="translate(10 10)"><path d="M24 10 42 39 33 39 24 25 15 39 6 39Z" fill="#2563EB"/><path d="M5 39 14 39 33 4 24 4Z" fill="#fff"/></g></svg></span><span class="logo-copy">PC
          Rental<small>设备租赁控制台</small></span></a>
      <span class="asset-tag mono">ASSET OPS / MEL</span>
      <nav class="main-nav">{{TOP_NAV}}</nav>
      <div class="user-block">{{USER_BLOCK}}</div>
      {{LANGUAGE_SWITCHER}}
    </header>
    <header class="mobile-header">
      <div class="mobile-header__lead">
        {{MOBILE_NAV_TOGGLE}}
        <a href="/" class="logo"><span class="logo-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#0A0A0F"/><g transform="translate(10 10)"><path d="M24 10 42 39 33 39 24 25 15 39 6 39Z" fill="#2563EB"/><path d="M5 39 14 39 33 4 24 4Z" fill="#fff"/></g></svg></span><span class="logo-copy">PC Rental</span></a>
        <span class="mobile-header__label">{{MOBILE_LABEL}}</span>
      </div>
      <div class="mobile-header__actions">
        {{LANGUAGE_SWITCHER}}
        <div class="user-block">{{MOBILE_USER_BLOCK}}</div>
      </div>
    </header>
    <div class="mobile-nav-scrim" aria-hidden="true"></div>
    {{SEARCH}}
    <div class="container">
      {{SIDEBAR}}
      <main class="content" id="main-content" tabindex="-1">{{CONTENT}}</main>
    </div>
    <nav class="mobile-bottom-nav" aria-label="移动端导航">{{MOBILE_NAV}}</nav>
    <aside class="notification-drawer" id="notification-drawer" aria-hidden="true"><div class="notification-drawer__head"><div><span class="section-code">INBOX</span><h2>通知中心</h2></div><button type="button" class="notification-drawer__close" aria-label="关闭通知">×</button></div><div class="notification-drawer__body" id="notification-drawer-body"><p class="empty-state">正在加载通知…</p></div><a class="button button-primary notification-drawer__all" href="/notifications">查看全部通知</a></aside>
    {{FOOTER}}
  </div>
  <script src="{{APP_SCRIPT}}" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/translation.js" defer></script>
</body>

</html>
